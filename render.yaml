services:
  - type: web
    name: doro-monsutakado
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doro-monsutakado-db
          property: connectionString
      - key: REDEMPTION_CODES_SEED
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
databases:
  - name: doro-monsutakado-db
    plan: basic-256mb
    postgresMajorVersion: "16"
